<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Church Display</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .display {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #fullscreenButton {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;

            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;

            border: none;
            border-radius: 6px;
            cursor: pointer;

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #fullscreenButton.visible {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <button id="fullscreenButton">Full Screen</button>

    <div class="display">

        <iframe
            src="https://docs.google.com/presentation/d/e/2PACX-1vQDMOCd19wMk0mzklb9YwSEBaHw7HYF9wQUN68cnBF-No0XfExwFWu7cy1wzdyK9NCirwODq15k0P_T/pubembed?start=true&loop=true&delayms=3000"
            allowfullscreen="true"
            mozallowfullscreen="true"
            webkitallowfullscreen="true">
        </iframe>

    </div>

    <script src="script.js"></script>

    <script>
        const fullscreenButton = document.getElementById("fullscreenButton");

        let hideButtonTimer;

        function showFullscreenButton() {
            fullscreenButton.classList.add("visible");

            clearTimeout(hideButtonTimer);

            hideButtonTimer = setTimeout(function () {
                fullscreenButton.classList.remove("visible");
            }, 3000);
        }

        document.addEventListener("mousemove", showFullscreenButton);

        fullscreenButton.addEventListener("click", function () {
            document.documentElement.requestFullscreen();
        });
    </script>

</body>
</html>
